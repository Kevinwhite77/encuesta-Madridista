<!DOCTYPE html>
<html lang="es-Es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real Madrid</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="contenedor">

    <h1>Bienvenido Madridista</h1>
    <p>Si eres madridista debes saber las siguientes preguntas:</p>
    <input type="text" id="nombreJugador" placeholder="Escribe tu nombre">

<br><br>

<a href="#" class="boton-redireccion" onclick="iniciarEncuesta()">
    ⚽ Iniciar Test Madridista
    
</a>

   
    <!-- Ventana de la encuesta -->
<div id="encuesta" class="encuesta">

    <div class="caja-encuesta">

        <h2>⚽ Test Madridista</h2>

        <p id="progreso">Pregunta 1 de 10</p>

        <div class="barra">
            <div id="barraProgreso"></div>
        </div>

        <h3 id="pregunta"></h3>

        <div id="opciones"></div>

        <button id="btnSiguiente" onclick="siguientePregunta()">
            Siguiente →
        </button>

    </div>

</div>
</div>
<script>

const preguntas = [

{
pregunta: "¿En qué año fue fundado el Real Madrid?",
opciones: ["1902", "1905", "1899"],
correcta: 0
},

{
pregunta: "¿Cuál es el estadio del Real Madrid?",
opciones: ["Camp Nou", "Santiago Bernabéu", "Mestalla"],
correcta: 1
},

{
pregunta: "¿Cuál es el clásico rival del Real Madrid?",
opciones: ["Atlético", "Barcelona", "Valencia"],
correcta: 1
},

{
pregunta: "¿Quién es el máximo goleador de la historia del Real Madrid?",
opciones: ["Cristiano Ronaldo", "Raúl", "Benzema"],
correcta: 0
},

{
pregunta: "¿Cuántas Champions League ha ganado el Real Madrid?",
opciones: ["15", "14", "13"],
correcta: 0
},

{
pregunta: "¿Quién fue el entrenador que ganó tres Champions consecutivas?",
opciones: ["Ancelotti", "Zidane", "Del Bosque"],
correcta: 1
},

{
pregunta: "¿Contra qué equipo ganó la Décima en 2014?",
opciones: ["Liverpool", "Barcelona", "Atlético de Madrid"],
correcta: 2
},

{
pregunta: "¿Quién marcó el gol del minuto 93 en Lisboa?",
opciones: ["Sergio Ramos", "Cristiano Ronaldo", "Bale"],
correcta: 0
},

{
pregunta: "¿Quién fue el primer presidente del Real Madrid?",
opciones: ["Julián Palacios", "Florentino Pérez", "Santiago Bernabéu"],
correcta: 0
},

{
pregunta: "¿En que año gano Real Madrid su primera Champions League?",
opciones: ["1956", "1957", "1958"],
correcta: 0
}

];

let preguntaActual = 0;
let puntos = 0;
let nombreJugador = "";
let respuestasUsuario = [];

function iniciarEncuesta(){

nombreJugador = document.getElementById("nombreJugador").value.trim();

if(nombreJugador === ""){
    alert("⚠️ Por favor escribe tu nombre antes de comenzar.");
    return;
}

document.getElementById("encuesta").style.display = "flex";

preguntaActual = 0;
puntos = 0;
let respuestasUsuario = [];

mostrarPregunta();

}

function mostrarPregunta(){

const pregunta = preguntas[preguntaActual];

document.getElementById("pregunta").textContent =
pregunta.pregunta;

document.getElementById("progreso").textContent =
`Pregunta ${preguntaActual + 1} de ${preguntas.length}`;

document.getElementById("barraProgreso").style.width =
`${((preguntaActual + 1) / preguntas.length) * 100}%`;

const opciones = document.getElementById("opciones");

opciones.innerHTML = "";

pregunta.opciones.forEach((opcion,index)=>{

opciones.innerHTML += `
<label>
<input type="radio" name="respuesta" value="${index}">
${opcion}
</label>
`;

});

}

function siguientePregunta(){

const seleccionada =
document.querySelector('input[name="respuesta"]:checked');

if(!seleccionada){

alert("Selecciona una respuesta");
return;

}

respuestasUsuario.push(parseInt(seleccionada.value));

if(parseInt(seleccionada.value) === preguntas[preguntaActual].correcta){

    puntos++;


}

preguntaActual++;

if(preguntaActual < preguntas.length){

mostrarPregunta();

}else{

mostrarResultado();

}

}

function mostrarResultado(){

let mensaje = "";
let emoji = "";

if(puntos === 10){

emoji = "🥇";
mensaje = "¡Eres una LEYENDA MADRIDISTA!";

}
else if(puntos >= 8){

emoji = "👑";
mensaje = "Eres un verdadero Madridista.";

}
else if(puntos >= 5){

emoji = "⚽";
mensaje = "Conoces bastante del Real Madrid.";

}
else{

emoji = "📚";
mensaje = "Debes conocer más sobre la historia del club.";

}
let resumen = "";

preguntas.forEach((pregunta, i) => {

    let correcta = pregunta.opciones[pregunta.correcta];
    let usuario = pregunta.opciones[respuestasUsuario[i]];

    if(respuestasUsuario[i] == pregunta.correcta){

        resumen += `
        <div style="margin-top:15px;padding:10px;border-radius:10px;background:#d4edda;">
            <b>✅ Pregunta ${i+1}</b><br>
            ${pregunta.pregunta}<br>
            Tu respuesta: <b>${usuario}</b>
        </div>
        `;

    }else{

        resumen += `
        <div style="margin-top:15px;padding:10px;border-radius:10px;background:#f8d7da;">
            <b>❌ Pregunta ${i+1}</b><br>
            ${pregunta.pregunta}<br>
            Tu respuesta: <b>${usuario}</b><br>
            Respuesta correcta: <b style="color:green;">${correcta}</b>
        </div>
        `;

    }

});
document.querySelector(".caja-encuesta").innerHTML = `
<h2>${emoji} Resultado Final</h2>

<h3>👤 ${nombreJugador}</h3>

<h1>${puntos}/10</h1>

<p>${mensaje}</p>

<button onclick="verRespuestas()">
📖 Ver respuestas
</button>

<br><br>

<button onclick="location.reload()">
🔄 Volver a jugar
</button>
`;
}
function verRespuestas(){

let resumen = "";

preguntas.forEach((pregunta, i)=>{

let correcta = pregunta.opciones[pregunta.correcta];
let usuario = pregunta.opciones[respuestasUsuario[i]];

if(respuestasUsuario[i] == pregunta.correcta){

resumen += `
<div style="background:#d4edda;padding:15px;border-radius:10px;margin:15px 0;">
<h3>✅ Pregunta ${i+1}</h3>

<p><b>${pregunta.pregunta}</b></p>

<p>Tu respuesta:
<b>${usuario}</b></p>

</div>
`;

}else{

resumen += `
<div style="background:#f8d7da;padding:15px;border-radius:10px;margin:15px 0;">
<h3>❌ Pregunta ${i+1}</h3>

<p><b>${pregunta.pregunta}</b></p>

<p>Tu respuesta:
<b>${usuario}</b></p>

<p>Respuesta correcta:
<b style="color:green;">${correcta}</b></p>

</div>
`;

}

});

document.querySelector(".caja-encuesta").innerHTML=`

<h2>📖 Revisión del Test</h2>

${resumen}

<button onclick="location.reload()">
🔄 Volver a jugar
</button>

`;

}
</script>
</body>
</html>
